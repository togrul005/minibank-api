<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiniBank — accounts, transfers and history" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // apply the theme before first paint (no flash)
      (function () {
        var ids = ['light', 'aurora', 'organic', 'retro', 'swiss'];
        var t = new URLSearchParams(location.search).get('theme');
        if (ids.indexOf(t) < 0) { try { t = localStorage.getItem('minibank.theme'); } catch (e) {} }
        document.documentElement.dataset.theme = ids.indexOf(t) < 0 ? 'light' : t;
      })();
    </script>
    <title>MiniBank</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
