server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the Spring Boot container: same origin, no CORS needed
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /actuator/ {
        proxy_pass http://app:8080;
    }

    # React Router: unknown paths load the app, which shows the right page
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
