spring.application.name=minibank

# --- Database (override with env vars, e.g. in docker-compose) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minibank}
spring.datasource.username=${DB_USER:minibank}
spring.datasource.password=${DB_PASSWORD:minibank}

# Flyway owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- CORS (frontend dev server) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator: only expose health ---
management.endpoints.web.exposure.include=health
